services:
  - type: web
    name: slave-card-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    healthCheckPath: /health

  - type: web
    name: slave-card-client
    runtime: static
    buildCommand: echo "Using committed Godot Web build"
    staticPublishPath: ./web-build
